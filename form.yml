attributes:
  num_gpus:
    widget: "number_field"
    label: "Number of GPUS"
    value: 0
    required: true
    help: "Specify the number of cores for the job"
    class: "gpu-count-field"
  gpu_type:
    label: GPU Type
    widget: select
    options:
      - ["any", "any"]
      - ["h100", "h100"]
      - ["a100", "a100"]
      - ["1080_ti", "1080_ti"]
      - ["v100", "v100"]
  desktop: xfce
  bc_queue:
    label: Slurm Partition
    widget: select
    options:
      - ["ampere", "ampere"]
      - ["cpu", "cpu"]
      - ["def", "def"]
      - ["hopper", "hopper"]
      - ["mem", "mem"]
      - ["small", "small"]
  bc_num_slots: null
  num_cores:
    widget: "number_field"
    label: "Number of Cores"
    value: 1
    min: 1
    max: 16
    required: true
    help: "Specify the number of cores for the job. Max: 16"
  bc_vnc_idle: 0
  bc_vnc_resolution:
    required: true
  node_type: null
  bc_account: null
  memory:
    widget: "number_field"
    label: "Memory (GB)"
    value: 2
    min: 1
    max: 32
    required: true
    help: "Specify the amount of memory in MB. Min: 2GB, Max: 32GB"
  bc_num_hours:
    widget: "number_field"
    label: "Number of Hours"
    value: 1
    min: 1
    max: 24
    required: true
    help: "Specify the number of hours. Min: 1hr, Max: 24hrs"
  custom_args:
    widget: "text_field"
    label: "Slurm Arguments"
    value: ""
    help: "Add any additional args. I.e. --reservation=my_reservation"

form:
  - bc_queue
  - bc_num_hours
  - num_cores
  - memory
  - num_gpus
  - gpu_type
  - desktop
  - bc_vnc_idle
  - bc_account
  - node_type
  - bc_vnc_resolution
  - custom_args
  # - bc_email_on_started
